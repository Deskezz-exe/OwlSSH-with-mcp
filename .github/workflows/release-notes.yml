name: Release notes

# Keeps a published release's description in sync with CHANGELOG.md, so the
# text can be fixed without rebuilding the installers.
on:
  push:
    branches: [main]
    paths: ["CHANGELOG.md", "docs/release-footer.md", "scripts/release-notes.sh"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update descriptions of released versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in $(grep -oP '^## \[\K[0-9][^]]*' CHANGELOG.md); do
            if gh release view "v$version" > /dev/null 2>&1; then
              bash scripts/release-notes.sh "$version" > notes.md
              gh release edit "v$version" --notes-file notes.md
              echo "Updated v$version"
            fi
          done
