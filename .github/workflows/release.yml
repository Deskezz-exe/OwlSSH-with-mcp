name: Release

# Push a tag like v0.1.0 to build OwlSSH for Windows, macOS and Linux and
# publish a GitHub release with installers, a portable exe and SHA-256 sums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          sed "s/<version>/$version/g" docs/release-footer.md >> notes.md
      - name: Create or reuse a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-pushing a tag reuses its release (drafts included) instead of failing.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=true -f body="$(cat notes.md)" > /dev/null
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "OwlSSH $GITHUB_REF_NAME" --notes-file notes.md
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            bundles: "src-tauri/target/release/bundle/nsis/*-setup.exe"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            bundles: "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg"
          - platform: ubuntu-22.04
            args: ""
            bundles: "src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installers
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(${{ matrix.bundles }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were produced" >&2
            exit 1
          fi
          ls -la "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - name: Upload portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp src-tauri/target/release/owlssh.exe "OwlSSH_${version}_x64_portable.exe"
          gh release upload "$GITHUB_REF_NAME" "OwlSSH_${version}_x64_portable.exe" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME"
          # Updater signatures and metadata are not things people download.
          rm -f *.sig latest.json
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
