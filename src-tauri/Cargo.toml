[package]
name = "owlssh"
version = "0.1.0"
description = "SSH client and server dashboard with a built-in MCP server for AI assistants"
authors = ["Deskezz-exe"]
license = "MIT"
repository = "https://github.com/Deskezz-exe/OwlSSH-with-mcp"
edition = "2021"
rust-version = "1.85"

[lib]
name = "owlssh_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
thiserror = "2.0.21"
dirs = "7.0.0"
tracing = "0.1.44"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "net"] }
keyring = "4"
glob = "0.3.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
