[package]
name = "owlssh"
version = "0.1.0"
description = "SSH client and server dashboard with a built-in MCP server for AI assistants"
authors = ["Deskezz-exe"]
license = "MIT"
repository = "https://github.com/Deskezz-exe/OwlSSH-with-mcp"
edition = "2021"
rust-version = "1.85"

[lib]
name = "owlssh_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
thiserror = "2.0.21"
dirs = "7.0.0"
tracing = "0.1.44"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "net"] }
keyring = "4"
glob = "0.3.4"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
russh-sftp = "3.0.1"
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1"
tokio-util = "0.7.20"
regex = "1.13.1"
tauri-plugin-opener = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
