[package]
name = "owlssh"
version = "0.1.0"
description = "SSH client and server dashboard with a built-in MCP server for AI assistants"
authors = ["Deskezz-exe"]
license = "MIT"
repository = "https://github.com/Deskezz-exe/OwlSSH-with-mcp"
edition = "2021"
rust-version = "1.85"

[lib]
name = "owlssh_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
